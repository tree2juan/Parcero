<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Parcero — Learn Colombian Spanish in Context">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eaf2e8"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a8a61"/>
      <stop offset="1" stop-color="#0d5039"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="14" fill="#f0b429"/>
  <rect x="0" y="14" width="1200" height="7" fill="#2a5db0"/>
  <rect x="0" y="21" width="1200" height="7" fill="#c8102e"/>

  <g transform="translate(80 96)">
    <rect width="76" height="76" rx="19" fill="url(#mark)"/>
    <text x="38" y="53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#fffdf8" text-anchor="middle">P</text>
  </g>

  <text x="176" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="3.4" fill="#146c4d">COLOMBIAN SPANISH IN CONTEXT</text>
  <text x="176" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#17251f">Parcero</text>

  <text x="80" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#17251f">Language belongs in</text>
  <text x="80" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#17251f">a conversation.</text>

  <text x="80" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#526059">Eight real situations — café, taxi, market, clinic, office, interview.</text>
  <text x="80" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#526059">Dialogue, culture, pronunciation, practice. Free and open.</text>

  <g transform="translate(80 508)">
    <rect width="424" height="74" rx="14" fill="#ffffff" stroke="#ced8ce"/>
    <rect width="6" height="74" rx="3" fill="#e66f4b"/>
    <text x="26" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#17251f">“¿Me regalas un tinto?”</text>
    <text x="26" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#526059">Could I have a black coffee, please?</text>
  </g>

  <g transform="translate(544 508)">
    <rect width="270" height="74" rx="14" fill="#ffffff" stroke="#ced8ce"/>
    <text x="24" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#146c4d">RUNS IN YOUR BROWSER</text>
    <text x="24" y="59" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#526059">No account. No tracking.</text>
  </g>

  <g transform="translate(878 176)" opacity="0.96">
    <rect width="242" height="286" rx="22" fill="#ffffff" stroke="#ced8ce"/>
    <rect x="34" y="-6" width="174" height="8" rx="4" fill="#f0b429"/>
    <text x="30" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#526059">LESSON 1</text>
    <text x="30" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#17251f">Un café y una</text>
    <text x="30" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#17251f">conversación</text>
    <rect x="30" y="146" width="182" height="12" rx="6" fill="#eaf2e8"/>
    <rect x="30" y="170" width="150" height="12" rx="6" fill="#eaf2e8"/>
    <rect x="30" y="194" width="166" height="12" rx="6" fill="#eaf2e8"/>
    <rect x="30" y="230" width="122" height="34" rx="10" fill="#146c4d"/>
    <text x="91" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Practice</text>
  </g>
</svg>
